name: Native iOS build
on:
  push:
    branches:
      - main
    paths:
      - 'FireWatchNative/**'
      - '.github/workflows/native-ios.yml'
  pull_request:
    paths:
      - 'FireWatchNative/**'
      - '.github/workflows/native-ios.yml'
concurrency:
  group: firewatch-native-ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: cd FireWatchNative && xcodegen generate
      - name: Build and run regression tests on iPhone Simulator
        run: |
          set -euo pipefail
          SIMULATOR_ID="$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin); xs=[x for group in d["devices"].values() for x in group if x.get("isAvailable") and x.get("name","").startswith("iPhone")]; print(xs[0]["udid"] if xs else "")')"
          if [ -z "$SIMULATOR_ID" ]; then
            echo "No available iPhone Simulator — tests cannot be skipped silently."
            exit 1
          fi
          # One destination/build: avoid rebuilding Swift/Firebase twice.
          xcodebuild test -project FireWatchNative/FireWatchNative.xcodeproj \
            -scheme FireWatchNative -configuration Debug -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -destination-timeout 120 -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO -quiet
