name: Backend tests
on:
  push:
    branches: [feature/native-ios-swiftui]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'
jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install system media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi 'uvicorn[standard]' python-multipart pydantic python-dotenv pillow numpy pytest httpx
      - name: Run backend tests
        run: pytest -q
