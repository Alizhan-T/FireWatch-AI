name: FireWatchNative
options:
  bundleIdPrefix: kz.firewatch
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: NO
    SUPPORTS_MACCATALYST: NO
targets:
  FireWatchNative:
    type: application
    platform: iOS
    sources:
      - path: FireWatchNative
    preBuildScripts:
      - name: Generate minimalist FireWatch AppIcon
        script: SDKROOT="$(xcrun --sdk macosx --show-sdk-path)" xcrun --sdk macosx swift "$SRCROOT/tools/generate_app_icon.swift"
        basedOnDependencyAnalysis: false
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: FireWatch AI
        CFBundleShortVersionString: "1.0.0"
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: Подключение к серверу FireWatch AI в локальной сети
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    # No Push Notifications entitlement by default: free Personal Teams can sign
    # and run the camera viewer on an actual iPhone.
    # APNs/FCM requires a paid Apple Developer team and explicit opt-in setup.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kz.firewatch.native
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
    scheme:
      testTargets:
        - FireWatchNativeTests

  FireWatchNativeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FireWatchNativeTests
    dependencies:
      - target: FireWatchNative
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
